# Keep the headless build safe on small remote hosts. Large heaps and parallel
# Kotlin/AAPT workers can make a 2 GiB, swapless machine unresponsive before
# the JVM gets a chance to report an ordinary out-of-memory error. This cap was
# verified with a forced clean Kotlin/R8 compilation of the full Compose UI.
# AGP 9.0's R8 global-synthetics pass needs more than 192 MiB of metaspace.
org.gradle.jvmargs=-Xms32m -Xmx384m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=24m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
org.gradle.internal.instrumentation.agent=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
shadow6.includeGoCore=true
shadow6.includeRustCore=true
shadow6.includeChat=true
shadow6.includeGames=true
shadow6.includePackages=true
shadow6.includeAI=true
