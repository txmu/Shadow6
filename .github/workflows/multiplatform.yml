name: multiplatform
# Also run third-party JavaScript actions which still declare Node 20 on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  standalone-coreless:
    name: Zero-Core security components and protocol adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Build and stage a zero-Core installation
        run: |
          set -euo pipefail
          source .venv/bin/activate
          ./configure --disable-cores
          stage_dir="$(mktemp -d /tmp/shadow6-coreless.XXXXXX)"
          trap 'rm -rf -- "$stage_dir"' EXIT
          make install PYTHON="$PWD/.venv/bin/python" DESTDIR="$stage_dir" PREFIX=/usr/local
          prefix="$stage_dir/usr/local"
          for core in go rust cpp gleam pony zig hare ada carp d nim idris; do
            test ! -e "$prefix/bin/shadow6-$core"
            test ! -e "$prefix/share/shadow6/tree/Core-${core^}/shadow6-$core"
          done
          "$prefix/bin/shadow6" standalone gate --feature-report
          "$prefix/bin/shadow6" standalone security doctor --standalone --root "$prefix" --component guard --component gate --component detector --component security
          "$prefix/bin/shadow6" openai-tools >/dev/null
          "$prefix/bin/shadow6" --json-events mcp </dev/null >/dev/null
      - name: Check modern and legacy tool protocol contracts
        run: |
          source .venv/bin/activate
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          cli = root / 'CLI/shadow6.py'
          metadata = {'io.modelcontextprotocol/protocolVersion': '2026-07-28',
                      'io.modelcontextprotocol/clientCapabilities': {}}
          requests = [
              {'jsonrpc': '2.0', 'id': 1, 'method': 'server/discover', 'params': {'_meta': metadata}},
              {'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list', 'params': {'_meta': metadata}},
              {'jsonrpc': '2.0', 'id': 3, 'method': 'tools/call',
               'params': {'_meta': metadata, 'name': 'shadow6_privacy_report', 'arguments': {}}},
          ]
          process = subprocess.run(['python3', str(cli), '--json-events', 'mcp'],
                                   input=''.join(json.dumps(item) + '\n' for item in requests),
                                   text=True, capture_output=True, check=True, timeout=20)
          replies = [json.loads(line) for line in process.stdout.splitlines()]
          assert len(replies) == 3
          assert replies[0]['result']['supportedVersions'][0] == '2026-07-28'
          assert replies[1]['result']['resultType'] == 'complete'
          assert replies[2]['result']['structuredContent']['profile'] == 'aggregate-only'
          tools = json.loads(subprocess.check_output(['python3', str(cli), 'openai-tools'], text=True))
          by_name = {tool['name']: tool for tool in tools}
          assert by_name['shadow6_privacy_report']['strict'] is True
          assert by_name['shadow6_system_guide']['parameters']['required'] == ['lang']
          PY
  python-network-runtime:
    name: Python networking (${{ matrix.os }}, ${{ matrix.python }}, GIL=${{ matrix.gil }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python: ['3.14', '3.14t']
        gil: ['1']
        include:
          - {os: ubuntu-24.04, python: '3.14t', gil: '0'}
          - {os: macos-14, python: '3.14t', gil: '0'}
          - {os: windows-latest, python: '3.14t', gil: '0'}
    env:
      EXPECT_GIL: ${{ matrix.gil }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with: {node-version: '24'}
      - name: Select GIL mode without forcing incompatible extensions
        shell: bash
        run: |
          if [ "$EXPECT_GIL" = 1 ]; then echo "PYTHON_GIL=1" >> "$GITHUB_ENV"; fi
      - name: Install supported cryptography wheels
        run: |
          python -m pip install --only-binary=:all: 'cryptography==50.0.1'
      - name: Verify actual runtime after dependency imports
        shell: bash
        run: |
          python Tools/python_runtime.py probe > python-runtime.json
          python -c "import json,os; r=json.load(open('python-runtime.json')); assert r['dependencies_ok']; assert r['gil_enabled']==(os.environ['EXPECT_GIL']=='1'), r"
      - name: Test both Python networking components and concurrent callers
        shell: bash
        run: |
          python -c "import os,sys,unittest; sys.path[:0]=['Network-Adapter','Public6','Tools']; names=['test_conformance','test_python_runtime','test_network.ThreadSafetyTests'] if os.name=='nt' else ['test_network','test_conformance','test_virtual_broker','test_python_runtime']; result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names)); sys.exit(not result.wasSuccessful())"
      - name: Equal component benchmarks for each runtime mode
        run: python Benchmark/component_benchmark.py --flow-bytes 131072 --output benchmark-python-runtime.json
      - name: Verify complete benchmark coverage
        run: python -c "import json,os; r=json.load(open('benchmark-python-runtime.json')); assert len(r['results'])==r['expected_rows']==884; assert all(x['status']=='ok' for x in r['results']); assert r['environment']['python_runtime']['gil_enabled']==(os.environ['EXPECT_GIL']=='1')"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-network-${{ matrix.os }}-${{ matrix.python }}-gil-${{ matrix.gil }}
          path: |
            python-runtime.json
            benchmark-python-runtime.json
  iperf3-matrix:
    name: iperf3 loopback pressure (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x86_64, runner: ubuntu-24.04, os: linux, python_arch: x64}
          - {label: linux-arm64, runner: ubuntu-24.04-arm, os: linux, python_arch: arm64}
          - {label: macos-x86_64, runner: macos-15-intel, os: macos, python_arch: x64}
          - {label: macos-arm64, runner: macos-15, os: macos, python_arch: arm64}
          - {label: windows-amd64, runner: windows-latest, os: windows, python_arch: x64}
          - {label: windows-arm64, runner: windows-11-arm, os: windows, python_arch: x64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install MSYS2 iperf3 on Windows
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          install: iperf3 python
      - name: Install iperf3 on Linux
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iperf3
      - name: Install iperf3 on macOS
        if: matrix.os == 'macos'
        run: brew install iperf3
      - name: Run bounded TCP and UDP loopback matrix
        if: matrix.os != 'windows'
        run: |
          python Tools/iperf3_matrix.py --output-dir iperf3-matrix \
            --duration 6 --max-streams 12 --udp-cap-mbps 2000
      - name: Run bounded TCP and UDP loopback matrix on Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          python Tools/iperf3_matrix.py --output-dir iperf3-matrix \
            --duration 6 --max-streams 12 --udp-cap-mbps 2000 \
            --skip-parallel-udp
      - name: Upload separate iperf3 report and raw cases
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-iperf3-${{ matrix.label }}
          path: iperf3-matrix/
          if-no-files-found: warn
  iperf3-musl:
    name: iperf3 Alpine musl (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v6
      - name: Run native Alpine TCP and UDP loopback matrix
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace alpine:3.23 /bin/sh -eu -c '
              apk add --no-cache python3 iperf3
              python3 Tools/iperf3_matrix.py --output-dir iperf3-musl \
                --duration 6 --max-streams 12 --udp-cap-mbps 2000
            '
      - name: Upload separate Alpine iperf3 report and raw cases
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-iperf3-alpine-${{ matrix.arch }}
          path: iperf3-musl/
          if-no-files-found: warn
  iperf3-bsd:
    name: iperf3 ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: freebsd, version: '14.4', arch: x86-64}
          - {os: freebsd, version: '14.4', arch: arm64}
          - {os: openbsd, version: '7.9', arch: x86-64}
          - {os: openbsd, version: '7.9', arch: arm64}
          - {os: netbsd, version: '10.1', arch: x86-64}
          - {os: netbsd, version: '10.1', arch: arm64}
    steps:
      - uses: actions/checkout@v6
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
          cpu_count: 2
          memory: 4G
      - name: Install native iperf3 and run loopback matrix
        shell: cpa.sh {0}
        run: |
          set -eu
          case '${{ matrix.os }}' in
            freebsd)
              sudo pkg update -f
              sudo pkg install -y python3 iperf3
              python=python3
              ;;
            openbsd)
              sudo pkg_add python-3.13.13 iperf3
              python=python3.13
              ;;
            netbsd)
              sudo pkgin -y update
              sudo pkgin -y install python311 iperf3
              python=/usr/pkg/bin/python3.11
              ;;
          esac
          "$python" Tools/iperf3_matrix.py --output-dir iperf3-bsd \
            --duration 6 --max-streams 12 --udp-cap-mbps 2000
      - name: Recover BSD reports after guest failure
        if: failure()
        run: cpa.sh --sync-files vm-to-runner
      - name: Upload separate BSD iperf3 report and raw cases
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-iperf3-${{ matrix.os }}-${{ matrix.arch }}
          path: iperf3-bsd/
          if-no-files-found: warn
  linux-qemu:
    name: Linux QEMU ${{ matrix.arch }} components
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: riscv64, binfmt: riscv64, packages: 'gcc-riscv64-linux-gnu libc6-dev-riscv64-cross'}
          - {arch: loongarch64, binfmt: loongarch64, packages: 'gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross'}
          - {arch: mips64, binfmt: mips64el, packages: 'gcc-mips64el-linux-gnuabi64 libc6-dev-mips64el-cross'}
          - {arch: s390x64, binfmt: s390x, packages: 'gcc-s390x-linux-gnu libc6-dev-s390x-cross'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version-file: Core-Go/go.mod}
      - name: Install emulators and target C toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support ${{ matrix.packages }}
          # Hosted runners may pre-register QEMU in the kernel without an
          # update-binfmts database entry. Preserve that working registration.
          entry=/proc/sys/fs/binfmt_misc/qemu-${{ matrix.binfmt }}
          if ! test -r "$entry" || ! grep -qx enabled "$entry"; then
            sudo update-binfmts --enable qemu-${{ matrix.binfmt }}
          fi
          grep -qx enabled "$entry"
      - name: Cross-build and execute target components and tests
        run: bash Tools/qemu_components.sh '${{ matrix.arch }}' "$GITHUB_WORKSPACE/qemu-components/${{ matrix.arch }}"
      - name: Upload target binaries and support evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-qemu-${{ matrix.arch }}-components
          path: qemu-components/${{ matrix.arch }}/
          if-no-files-found: warn
  node-adapter:
    name: Network Adapter (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Test supported Node runtimes and Python interoperability
        run: |
          python -m pip install 'cryptography==50.0.1'
          node --test Network-Adapter/test_node.mjs
          PYTHONPATH=Network-Adapter python -m unittest test_conformance test_secure_key
  pony-only:
    name: Core-Pony focused contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Provision pinned Pony toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools/ponyc-0.72.0
          curl --fail --location --retry 3 \
            --output /tmp/ponyc.tar.gz \
            https://github.com/ponylang/ponyc/releases/download/0.72.0/ponyc-x86-64-unknown-linux-ubuntu24.04.tar.gz
          echo 'a101427ff3daa510b821860b04a6bb786e42803fcfa8fa7723bb8183102b5a91  /tmp/ponyc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ponyc.tar.gz --strip-components=1 -C .tools/ponyc-0.72.0
          test -x .tools/ponyc-0.72.0/bin/ponyc
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libsodium-dev libssl-dev python3
      - name: Build default and Crosed variants
        run: make pony-crosed-variant BUILD_PONY=1 PONYC="$GITHUB_WORKSPACE/.tools/ponyc-0.72.0/bin/ponyc"
      - name: Run Pony contract and crypto tests
        run: |
          python3 Core-Pony/tests/test_core.py --binary
          python3 Core-Pony/tests/test_crypto.py
      - name: Run real Pony network tests
        run: python3 Core-Pony/tests/test_network.py
      - name: Verify feature contracts
        run: |
          test "$(Core-Pony/shadow6-pony --feature-report | python3 -c 'import json,sys; print(json.load(sys.stdin)["crosed_max_level"])')" = 0
          test "$(Core-Pony/shadow6-pony-crosed --feature-report | python3 -c 'import json,sys; print(json.load(sys.stdin)["crosed_max_level"])')" = 5
  idris:
    name: Core-Idris (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: Homebrew/actions/setup-homebrew@49d03f1bf5d455a413dfbdf99e6718054a4cd975
        if: matrix.os != 'ubuntu-24.04-arm'
      - name: Install Core-Idris prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgmp-dev libsodium-dev pkg-config
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            bash Tools/bootstrap_chez_linux.sh
          else
            sudo apt-get install -y --no-install-recommends chezscheme
          fi
      - name: Install Core-Idris prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium pkg-config
      - name: Configure Core-Idris FFI library path
        shell: bash
        run: |
          ffi_dir="$GITHUB_WORKSPACE/Core-Idris/ffi"
          echo "LD_LIBRARY_PATH=$ffi_dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "DYLD_LIBRARY_PATH=$ffi_dir:$(brew --prefix libsodium)/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi
      - name: Install Idris2 binary package
        if: matrix.os != 'ubuntu-24.04-arm'
        shell: bash
        run: |
          brew install idris2
          idris2="$(brew --prefix idris2)/bin/idris2"
          test -x "$idris2"
          echo "$(dirname "$idris2")" >> "$GITHUB_PATH"
          echo "IDRIS2=$idris2" >> "$GITHUB_ENV"
      - name: Bootstrap pinned native ARM64 Idris2
        if: matrix.os == 'ubuntu-24.04-arm'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git "$RUNNER_TEMP/idris2-source"
          test "$(git -C "$RUNNER_TEMP/idris2-source" rev-parse HEAD)" = 15a3e4e70843f7a34100f6470c04b791330788df
          make -C "$RUNNER_TEMP/idris2-source" bootstrap SCHEME=chezscheme PREFIX="$GITHUB_WORKSPACE/.tools/idris2"
          make -C "$RUNNER_TEMP/idris2-source" install PREFIX="$GITHUB_WORKSPACE/.tools/idris2"
          echo "$GITHUB_WORKSPACE/.tools/idris2/bin" >> "$GITHUB_PATH"
          echo "IDRIS2=$GITHUB_WORKSPACE/.tools/idris2/bin/idris2" >> "$GITHUB_ENV"
      - name: Check Idris modules sequentially
        shell: bash
        run: |
          set -euo pipefail
          sources=(
            Core-Idris/src/Shadow6/Types.idr
            Core-Idris/src/Shadow6/Security/Context.idr
            Core-Idris/src/Shadow6/Security/Policy.idr
            Core-Idris/src/Shadow6/Security/Operations.idr
            Core-Idris/src/Shadow6/Security/Socket.idr
            Core-Idris/src/Shadow6/Security/Lifecycle.idr
            Core-Idris/src/Shadow6/Security/Allocation.idr
            Core-Idris/src/Shadow6/Security.idr
            Core-Idris/src/Shadow6/Crypto.idr
            Core-Idris/src/Shadow6/Protocol.idr
            Core-Idris/src/Shadow6/Features.idr
            Core-Idris/src/Main.idr
          )
          for source in "${sources[@]}"; do
            echo "::group::Checking $source"
            "$IDRIS2" --check "$source" --source-dir Core-Idris/src \
              --build-dir "$RUNNER_TEMP/idris-check" -p contrib -p network
            echo "::endgroup::"
          done
      - name: Build and test Core-Idris
        run: make test-idris PYTHON=python3
      - name: Exercise real bounded UDP event loop
        run: |
          set -euo pipefail
          test -x Core-Idris/shadow6-idris
          Core-Idris/shadow6-idris --udp-loopback 0 1
      - name: Run real loopback integration
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/Core-Idris/ffi:${LD_LIBRARY_PATH:-}"
          Core-Idris/shadow6-idris --loopback-test
          test "$(${GITHUB_WORKSPACE}/Core-Idris/shadow6-idris --feature-report | python3 -c 'import json,sys; print(json.load(sys.stdin)["crosed_max_level"])')" = 0
      - name: Build and test Crosed variant
        run: make idris-crosed-variant PYTHON=python3 && python3 Core-Idris/test_core.py
      - name: Verify Idris native and both companion paths
        run: |
          python3 -m venv "$RUNNER_TEMP/idris-network-env"
          "$RUNNER_TEMP/idris-network-env/bin/pip" install 'cryptography>=43,<47'
          "$RUNNER_TEMP/idris-network-env/bin/python" Core-Idris/test_security.py
          "$RUNNER_TEMP/idris-network-env/bin/python" integration/test_native_chains.py NativeBrokerTests.test_idris_admission
          "$RUNNER_TEMP/idris-network-env/bin/python" Benchmark/benchmark.py --core idris --role network-chain --payload-bytes 4096 --requests 8 --concurrency 4 --require-network --output idris-network
      - name: Upload Idris network reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-idris-network-benchmark-${{ matrix.os }}
          path: idris-network.*
          if-no-files-found: warn
      - name: Collect Core-Idris build outputs
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/core-idris-$RUNNER_OS"
          mkdir -p "$output_dir"
          artifact_dir="$RUNNER_TEMP/core-idris-artifact-$RUNNER_OS"
          mkdir -p "$artifact_dir"
          install -m 0755 Core-Idris/shadow6-idris "$output_dir/shadow6-idris"
          install -m 0755 Core-Idris/shadow6-idris-crosed "$output_dir/shadow6-idris-crosed"
          cp -a Core-Idris/shadow6-idris_app "$output_dir/"
          cp -a Core-Idris/shadow6-idris-crosed_app "$output_dir/"
          cp Core-Idris/ffi/libsodium_ffi.so "$output_dir/" 2>/dev/null || \
            cp Core-Idris/ffi/libsodium_ffi.dylib "$output_dir/"
          library_path="$GITHUB_WORKSPACE/Core-Idris/ffi:${LD_LIBRARY_PATH:-}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/Core-Idris/ffi:${DYLD_LIBRARY_PATH:-}"
          else
            export LD_LIBRARY_PATH="$library_path"
          fi
          "$output_dir/shadow6-idris" --feature-report > "$output_dir/feature-report-l0.json"
          "$output_dir/shadow6-idris-crosed" --feature-report > "$output_dir/feature-report-l5.json"
          (cd "$output_dir" && find . -type f -print | LC_ALL=C sort | while IFS= read -r file; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$file"; else shasum -a 256 "$file"; fi
          done > SHA256SUMS)
          # Idris2/Chez emits a launcher plus a runtime tree whose links,
          # modes, and relative layout are part of the executable contract.
          # Preserve that tree as one archive instead of reconstructing it
          # from independently downloaded files.
          tar -C "$output_dir" -czf "$artifact_dir/core-idris-runtime.tar.gz" .
          test -s "$artifact_dir/core-idris-runtime.tar.gz"
          du -ah "$output_dir"
          cat "$output_dir/SHA256SUMS"
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-idris-${{ matrix.os }}
          path: ${{ runner.temp }}/core-idris-artifact-${{ runner.os }}/core-idris-runtime.tar.gz
          if-no-files-found: error
  linux-gleam:
    name: Core-Gleam (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install static BEAM prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential musl-tools curl perl m4 autoconf
      - name: Provision pinned no-JIT Gleam toolchain
        run: |
          Core-Gleam/tools/fetch_toolchain.sh
          Core-Gleam/tools/build_toolchain.sh
          Core-Gleam/tools/verify_toolchain.sh
      - name: Build and test default Core-Gleam
        run: |
          python3 -m pip install 'cryptography>=43,<47'
          make test-gleam BUILD_GLEAM=1 PYTHON=python3
      - name: Preserve toolchain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gleam-toolchain-logs-${{ matrix.arch }}
          path: .tools/gleam/logs/*.log
          if-no-files-found: ignore
      - name: Build and verify L5 Core-Gleam
        run: |
          make core-gleam BUILD_GLEAM=1 CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1
          install -m 0755 Core-Gleam/shadow6-gleam Core-Gleam/shadow6-gleam-crosed
          make core-gleam BUILD_GLEAM=1 CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0
          python3 - <<'PY'
          import json, subprocess
          for path, level in (("Core-Gleam/shadow6-gleam", 0), ("Core-Gleam/shadow6-gleam-crosed", 5)):
              report=json.loads(subprocess.check_output([path,"--feature-report"],text=True))
              assert report["crosed_max_level"] == level
          PY
      - name: Verify immutable static PIE
        run: |
          readelf -W -h Core-Gleam/shadow6-gleam | grep -Eq 'Type: +DYN'
          readelf -W -l Core-Gleam/shadow6-gleam | grep -E 'GNU_STACK.*RW|GNU_RELRO'
          readelf -W -d Core-Gleam/shadow6-gleam | grep -q BIND_NOW
          ! readelf -W -d Core-Gleam/shadow6-gleam | grep -q NEEDED
          ldd Core-Gleam/shadow6-gleam 2>&1 | grep -Eq 'statically linked|not a dynamic executable'
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-gleam-${{ matrix.arch }}
          path: |
            Core-Gleam/shadow6-gleam
            Core-Gleam/shadow6-gleam-crosed
          if-no-files-found: error
  carp-generated:
    name: Generate portable Carp source for native ARM64 compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate with the pinned Carp release
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/carp-lang/Carp/releases/download/v0.5.5/carp-v0.5.5-x86_64-linux.zip \
            --output "$RUNNER_TEMP/carp.zip"
          unzip -q "$RUNNER_TEMP/carp.zip" -d .tools
          export CARP_DIR="$GITHUB_WORKSPACE/.tools/carp-v0.5.5-x86_64-linux"
          cd Core-Carp
          mkdir -p build
          "$CARP_DIR/bin/carp" --no-profile --optimize --generate-only -b src/main.carp
          test -s build/main.c
          test -s build/schema.h
          cd ..
          tar -czf "$RUNNER_TEMP/carp-generated.tar.gz" Core-Carp/build/main.c Core-Carp/build/schema.h .tools/carp-v0.5.5-x86_64-linux/core
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-carp-generated
          path: ${{ runner.temp }}/carp-generated.tar.gz
          if-no-files-found: error
  linux:
    needs: [idris, linux-gleam]
    runs-on: ubuntu-latest
    env:
      BUILD_HARE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v6
        with: {go-version-file: Core-Go/go.mod}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/Cargo.lock') }}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: goto-bus-stop/setup-zig@v2
        with: {version: '0.16.0'}
      - name: Cache Nim toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.choosenim
            ~/.nimble
            ~/.cache/nim
          key: nim-${{ runner.os }}-2.2.10
      - uses: jiro4989/setup-nim-action@v2
        timeout-minutes: 5
        with: {nim-version: '2.2.10'}
      - uses: dlang-community/setup-dlang@v2
        with: {compiler: ldc-1.40.0}
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsodium-dev libunistring-dev \
            gnat gprbuild ldc shellcheck unzip iperf3
          # Idris2's compiled Chez images require the exact Chez fasl ABI used
          # by the producer job. Install the same Homebrew Chez on this Ubuntu
          # consumer instead of executing with the distro's older ABI.
          #
          # Never install the distro chezscheme package in this job: the signed
          # audit runbook executes with PATH=/usr/bin:/bin:/usr/local/bin, so an
          # apt interpreter in /usr/bin shadows the ABI-matched Homebrew Chez
          # and every Idris feature report fails with
          # "incompatible fasl-object version".
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install chezscheme
          echo "$(brew --prefix chezscheme)/bin" >> "$GITHUB_PATH"
      - name: Download same-commit Gleam Linux builds
        uses: actions/download-artifact@v7
        with:
          name: shadow6-gleam-x86_64
          path: Core-Gleam
      - name: Download same-commit Idris Linux builds
        uses: actions/download-artifact@v7
        with:
          name: shadow6-idris-ubuntu-latest
          path: ${{ runner.temp }}/idris-artifact
      - name: Restore executable modes for downloaded core artifacts
        run: |
          # The runtime artifact intentionally contains only the compiled
          # Idris tree. Preserve the checked-in real integration harness
          # before replacing the build directory so the full-stack test still
          # exercises the downloaded binary instead of silently skipping it.
          cp Core-Idris/test_core.py "$RUNNER_TEMP/shadow6-idris-test_core.py"
          # Keep the checked-in Idris sources available to the Linux component
          # doctor after replacing this directory with the runtime artifact.
          cp -a Core-Idris/src "$RUNNER_TEMP/shadow6-idris-src"
          rm -rf Core-Idris
          mkdir -p Core-Idris
          archive=$(find "$RUNNER_TEMP/idris-artifact" -type f -name 'core-idris-*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C Core-Idris
          install -m 0755 "$RUNNER_TEMP/shadow6-idris-test_core.py" Core-Idris/test_core.py
          cp -a "$RUNNER_TEMP/shadow6-idris-src" Core-Idris/src
          chmod 0755 Core-Gleam/shadow6-gleam Core-Gleam/shadow6-gleam-crosed
          # Resolve the ABI-matched Chez before creating the /usr/local/bin
          # shim. The compiled image is executed through "env chezscheme", and
          # the signed audit runbook pins PATH=/usr/bin:/bin:/usr/local/bin, so
          # this shim is what the audit actually resolves. Refuse to fall back
          # to a distro interpreter: a mismatched fasl ABI would surface as an
          # Idris feature-report failure rather than an explicit error.
          chez_bin="$(/home/linuxbrew/.linuxbrew/bin/brew --prefix chezscheme)/bin/chez"
          test -x "$chez_bin"
          printf '#!/bin/bash\nexec "%s" "$@"\n' "$chez_bin" | sudo tee /usr/local/bin/chezscheme > /dev/null
          sudo chmod 0755 /usr/local/bin/chezscheme
          test "$(PATH=/usr/bin:/bin:/usr/local/bin command -v chezscheme)" = /usr/local/bin/chezscheme
          cd Core-Idris
          chmod 0755 shadow6-idris shadow6-idris-crosed
          test -d shadow6-idris_app && test -d shadow6-idris-crosed_app
          find shadow6-idris_app shadow6-idris-crosed_app -type f -exec chmod 0755 {} +
          # Chez embeds its absolute interpreter path in the generated Idris
          # launcher. Rebind only the downloaded runtime to the runner's
          # installed Chez binary; the compiled Scheme image and support
          # libraries remain byte-for-byte intact.
          for image in shadow6-idris_app/shadow6-idris.so shadow6-idris-crosed_app/shadow6-idris.so; do
            test -f "$image"
            # Use env's portable shebang form so the packaged image does not
            # retain the producer runner's absolute Homebrew path.
            sed -i '1c#!/usr/bin/env -S chezscheme --program' "$image"
          done
          # The launcher executes immediately in this shell.  Export both
          # the extracted artifact root and its optional ffi directory before
          # the feature reports; writing GITHUB_ENV alone only affects later
          # workflow steps and made libsodium_ffi.so appear to be missing.
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/Core-Idris:$GITHUB_WORKSPACE/Core-Idris/shadow6-idris_app:$GITHUB_WORKSPACE/Core-Idris/ffi:${LD_LIBRARY_PATH:-}"
          # Reproduce the signed audit runbook's fixed PATH (SAFE_EXECUTION_PATH
          # in Infrastructure-Assistants/shadow6_infra.py).  "make test" runs
          # that runbook, so an interpreter that only resolves under the
          # runner's Homebrew-first PATH would pass here and then fail the
          # Idris feature reports inside "make test".
          audit_path=/usr/bin:/bin:/usr/local/bin
          PATH="$audit_path" ./shadow6-idris --feature-report >/dev/null
          PATH="$audit_path" ./shadow6-idris-crosed --feature-report >/dev/null
          cd ..
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Provision pinned Hare toolchain
        timeout-minutes: 15
        run: |
          bash Tools/bootstrap_hare_linux.sh "$GITHUB_WORKSPACE/.tools/hare-ci"
          echo "$GITHUB_WORKSPACE/.tools/hare-ci/bin" >> "$GITHUB_PATH"
      - name: Provision pinned Pony toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --location --retry 3 \
            --output /tmp/ponyc.tar.gz \
            https://github.com/ponylang/ponyc/releases/download/0.72.0/ponyc-x86-64-unknown-linux-ubuntu24.04.tar.gz
          echo 'a101427ff3daa510b821860b04a6bb786e42803fcfa8fa7723bb8183102b5a91  /tmp/ponyc.tar.gz' | sha256sum -c -
          mkdir -p .tools/ponyc-0.72.0
          tar -xzf /tmp/ponyc.tar.gz --strip-components=1 -C .tools/ponyc-0.72.0
          test -x .tools/ponyc-0.72.0/bin/ponyc
          echo "$GITHUB_WORKSPACE/.tools/ponyc-0.72.0/bin" >> "$GITHUB_PATH"
      - name: Build pinned native libdatachannel for Core-Nim
        run: |
          set -euo pipefail
          git clone https://github.com/paullouisageneau/libdatachannel.git "$RUNNER_TEMP/shadow6-rtc-linux"
          git -C "$RUNNER_TEMP/shadow6-rtc-linux" fetch --no-tags origin 9e6a13abbb6846c003d817d0387b6706466e2b03
          git -C "$RUNNER_TEMP/shadow6-rtc-linux" checkout --detach 9e6a13abbb6846c003d817d0387b6706466e2b03
          git -C "$RUNNER_TEMP/shadow6-rtc-linux" submodule update --init --recursive --depth 1
          cmake -S "$RUNNER_TEMP/shadow6-rtc-linux" -B "$RUNNER_TEMP/shadow6-rtc-linux-build" -DCMAKE_BUILD_TYPE=Release -DNO_TESTS=ON -DNO_EXAMPLES=ON -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/shadow6-rtc-linux-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/shadow6-rtc-linux-build"
          sudo ldconfig
          test -f /usr/local/include/rtc/rtc.h
          cp -L /usr/local/lib/libdatachannel.so.0.23 Core-Nim/libdatachannel.so.0.23
      - run: python -m venv .venv
      - name: Provision fixed Carp release
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/carp-lang/Carp/releases/download/v0.5.5/carp-v0.5.5-x86_64-linux.zip \
            --output "$RUNNER_TEMP/carp.zip"
          unzip -q "$RUNNER_TEMP/carp.zip" -d .tools
          test -x .tools/carp-v0.5.5-x86_64-linux/bin/carp
      - run: .venv/bin/pip install -r requirements.txt -r requirements-ml.txt
      - name: Configure the complete Linux component matrix
        run: ./configure --enable-all
      - name: Build every Linux core and component
        run: |
          make build BUILD_ZIG=1 BUILD_ADA=1 BUILD_CPP=1 BUILD_PONY=1
          make core-nim
          make nim-crosed-variant
          make core-d
          test -x Core-Hare/shadow6-hare
          test -x Core-Go/shadow6-go
          test -x Core-Rust/shadow6-rust
          test -x Core-Cpp/shadow6-cpp
          test -x Core-Zig/shadow6-zig
          test -x Core-Ada/shadow6-ada
          test -x Core-Nim/shadow6-nim
          test -x Core-D/shadow6-d
          test -x Core-Pony/shadow6-pony
          test -x Core-Carp/shadow6-carp
          Core-Gleam/shadow6-gleam --feature-report
          (cd Core-Idris && ./shadow6-idris --feature-report)
          test -x Gate/shadow6-gate
          test -x Guard/shadow6-guard
          test -x C11Relay/bridge_relay
          make test-zig BUILD_ZIG=1
          make ada-crosed-variant
          Core-Ada/test_cells
          .venv/bin/python Core-Ada/test_core.py
          make test-nim
          make test-d
          make test-hare
      - name: Verify native dependencies and hardening
        run: |
          check_elf() {
            binary=$1
            require_bind_now=${2:-1}
            test -x "$binary"
            readelf -W -h "$binary" | grep -Eq 'Type:[[:space:]]+DYN'
            programs=$(readelf -W -l "$binary")
            stack=$(printf '%s\n' "$programs" | grep GNU_STACK)
            printf '%s\n' "$programs" | grep -q GNU_RELRO
            printf '%s\n' "$stack" | grep -qw RW
            if printf '%s\n' "$stack" | grep -qw RWE; then
              echo "$binary: executable stack" >&2
              return 1
            fi
            if [ "$require_bind_now" = 1 ]; then
              readelf -W -d "$binary" | grep -q BIND_NOW
            fi
          }
          check_elf Core-Go/shadow6-go 0
          check_elf Core-Rust/shadow6-rust
          check_elf Core-Gleam/shadow6-gleam
          check_elf Core-Zig/shadow6-zig
          check_elf Core-Ada/shadow6-ada
          check_elf Core-D/shadow6-d
          check_elf Core-Nim/shadow6-nim
          check_elf Core-Cpp/shadow6-cpp
          check_elf Core-Hare/shadow6-hare
          check_elf Core-Carp/shadow6-carp
          check_elf Core-Pony/shadow6-pony 0
          check_elf C11Relay/bridge_relay
          check_elf Guard/shadow6-guard 0
          check_elf Gate/shadow6-gate 0
          test -x Core-Idris/shadow6-idris
          test -x Core-Idris/shadow6-idris-crosed
          readelf -d Core-Cpp/shadow6-cpp | grep -E 'libssl|libcrypto|libstdc\+\+'
          shellcheck configure Core-Cpp/*.sh C11Relay/*.sh Guard/*.sh Tools/*.sh Core-Carp/*.sh Core-Gleam/*.sh
      - run: make crosed-variants BUILD_PONY=1
      - run: make test
      - name: Benchmark both S6NA backends
        run: |
          set -euo pipefail
          .venv/bin/python Network-Adapter/benchmark_backends.py > benchmark-linux-adapter.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmark-linux-adapter.json').read_text())
          assert report['schema'] == 'shadow6.benchmark.v2'
          rows = report['results']
          assert len(rows) == 36
          assert {row['backend'] for row in rows} == {'native', 'python', 'node'}
          assert len({row['core'] for row in rows}) == 12
          assert all(row['status'] == 'ok' and row['network']['bytes_received'] > 0 for row in rows)
          print('S6NA benchmark rows:', len(rows))
          PY
      - run: make check
      - run: make audit
      - run: .venv/bin/python Security-Assistants/shadow6_security.py doctor
      - run: .venv/bin/python Security-Assistants/shadow6_security.py sbom --output /tmp/shadow6-sbom.json
      - run: .venv/bin/python Infrastructure-Assistants/shadow6_infra.py observe --output /tmp/shadow6-observation.json
      - name: Validate staged installation and component catalogs
        run: |
          # Installed Python entrypoints use /usr/bin/env python3.
          source .venv/bin/activate
          stage_dir="$(mktemp -d /tmp/shadow6-install.XXXXXX)"
          trap 'rm -rf -- "$stage_dir"' EXIT
          make install DESTDIR="$stage_dir" PREFIX=/usr/local
          "$stage_dir/usr/local/bin/shadow6-hare" --feature-report
          "$stage_dir/usr/local/bin/shadow6-plugins" list
          "$stage_dir/usr/local/bin/shadow6-security" list >/dev/null
          "$stage_dir/usr/local/bin/shadow6-control" schema >/tmp/shadow6-staged-schema.json
          "$stage_dir/usr/local/bin/shadow6-slots" catalog >/tmp/shadow6-staged-slots.json
          # The installed entry points resolve their tree through
          # <prefix>/share/shadow6/tree, so the doctor, the SBOM and the
          # component observation must work from the installed layout alone,
          # without a hard-coded /usr/local prefix or the source checkout.
          installed_tree="$stage_dir/usr/local/share/shadow6/tree"
          test -f "$installed_tree/Makefile"
          test -x "$installed_tree/Core-Go/shadow6-go"
          test -x "$stage_dir/usr/local/bin/shadow6-go-crosed"
          test -x "$stage_dir/usr/local/bin/shadow6-rust-public6"
          unset SHADOW6_ROOT
          ( cd / && "$stage_dir/usr/local/bin/shadow6-security" doctor ) >/tmp/shadow6-staged-doctor.json
          python3 -c 'import json,sys; report=json.load(open("/tmp/shadow6-staged-doctor.json")); assert report["status"] == "pass", report; print("installed doctor", report["score"])'
          "$stage_dir/usr/local/bin/shadow6-security" sbom --output /tmp/shadow6-staged-sbom.json
          "$stage_dir/usr/local/bin/shadow6-infra" observe --output /tmp/shadow6-staged-observation.json
      - name: Run final benchmarks after all Linux builds and tests
        run: |
          # Exercise every compiled core's real loopback transport.  Keep this
          # as a separate gate so a missing/invalid network measurement cannot
          # be hidden by feature-report rows or a not-applicable SCTP probe.
          python3 Benchmark/benchmark.py \
            --core go --core rust --core zig --core ada --core d --core nim \
            --core cpp --core pony --core hare --core carp --core gleam --core idris \
            --role network-chain --repeats 3 --require-network \
            --output benchmark-linux-network
          python3 Benchmark/benchmark.py --config Benchmark/example.json --output benchmark-linux.json
          python3 CLI/shadow6.py benchmark --all --role feature-report --repeats 3 --output benchmark-cli-all.json
      - name: Equal 12 by 3 concurrent pressure gate
        run: |
          .venv/bin/python Benchmark/benchmark.py --role network-chain --payload-bytes 4096 --requests 8 --concurrency 4 --require-network --output benchmark-linux-pressure
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          report = json.loads(Path('benchmark-linux-pressure.json').read_text())
          rows = report['results']
          assert len(rows) == 36
          assert len({(r['core'], r['backend']) for r in rows}) == 36
          assert Counter(r['backend'] for r in rows) == {'native': 12, 'python': 12, 'node': 12}
          assert all(r['status'] == 'ok' and r['network']['concurrency'] == 4 and r['network']['bytes_received'] == 4096 * 8 * 4 for r in rows)
          PY
      - name: Native loss recovery and equal component performance coverage
        timeout-minutes: 20
        run: |
          .venv/bin/python integration/test_native_reliability.py
          .venv/bin/python Benchmark/component_benchmark.py --flow-bytes 131072 --output benchmark-linux-components.json
          .venv/bin/python - <<'PY'
          import json
          report = json.load(open('benchmark-linux-components.json'))
          rows = report['results']
          assert report['expected_rows'] == 12 * 2 * 3 * 3 * 4 + 3 * 3 * 2 + 2
          assert len(rows) == report['expected_rows']
          assert all(row['status'] == 'ok' for row in rows)
          profiles = {row['core'] for row in rows if row['component'] == 'adapter'}
          assert len(profiles) == 12
          PY
      - name: Real iperf3 data through all twelve native ABC deployments
        timeout-minutes: 20
        run: |
          .venv/bin/python -m unittest discover -s Benchmark -p 'test_iperf_chain.py'
          .venv/bin/python Benchmark/iperf_chain.py --seconds 3 --require-gbps --output benchmark-iperf-chain
      - name: Upload native iperf3 receiver results and raw evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-iperf-chain
          path: benchmark-iperf-chain/
          if-no-files-found: warn
      - name: Upload Linux network benchmark reports (JSON/TXT/Markdown)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-network-benchmark
          path: |
            benchmark-linux-adapter.json
            benchmark-linux.json
            benchmark-linux.txt
            benchmark-linux.md
            benchmark-cli-all.json
            benchmark-cli-all.txt
            benchmark-cli-all.md
            benchmark-linux-network.json
            benchmark-linux-network.txt
            benchmark-linux-network.md
            benchmark-linux-pressure.json
            benchmark-linux-pressure.txt
            benchmark-linux-pressure.md
            benchmark-linux-components.json
          if-no-files-found: warn
      - name: Package and collect every Linux release output
        run: |
          make package
          mkdir -p ci-artifacts/linux
          cp ../Shadow6.tar.gz ../Shadow6.zip ci-artifacts/linux/
          # Guard the doctor permission contract inside the packaged Linux
          # artifact: binaries must never carry group/other write bits.  This
          # reproduces and blocks the CI failure mode where a permissive build
          # umask leaks 0775-style modes into the tar.
          verif_dir="$(mktemp -d /tmp/shadow6-verify.XXXXXX)"
          tar -xzf ../Shadow6.tar.gz -C "$verif_dir"
          # Extraction on some runners applies a permissive umask, so clear
          # write bits before the offline doctor check.  This never installs
          # binaries or mutates the source checkout.
          find "$verif_dir/Shadow6" -type f \( -name 'shadow6-*' -o -name 'bridge_relay' -o -name 'c11relay_test' \) -exec chmod a-w {} +
          .venv/bin/python Security-Assistants/shadow6_security.py doctor --root "$verif_dir/Shadow6"
          test "$(find "$verif_dir/Shadow6" -type f \( -name 'shadow6-*' -o -name 'bridge_relay' \) -perm /022 | wc -l)" -eq 0
          rm -rf -- "$verif_dir"
          cp /tmp/shadow6-sbom.json /tmp/shadow6-observation.json ci-artifacts/linux/
          cp benchmark-linux.* benchmark-linux-network.* benchmark-cli-all.* ci-artifacts/linux/
          tar -tzf ci-artifacts/linux/Shadow6.tar.gz >/dev/null
          unzip -tq ci-artifacts/linux/Shadow6.zip
          test "$(tar -tzf ci-artifacts/linux/Shadow6.tar.gz | grep -c 'Core-Cpp/shadow6-cpp$')" -eq 1
          test "$(tar -tzf ci-artifacts/linux/Shadow6.tar.gz | grep -c 'Core-Hare/shadow6-hare$')" -eq 1
          unzip -Z1 ci-artifacts/linux/Shadow6.zip | awk 'NF && $0 !~ /\/$/ && $0 !~ /\.txt$/ {bad=1} END {exit bad}'
          unzip -Z1 ci-artifacts/linux/Shadow6.zip | grep -qx 'Shadow6/.github/workflows/multiplatform.yml.txt'
      - name: Dump Linux environment and benchmark diagnostics
        if: always()
        run: |
          { uname -a; python3 --version; go version; rustc --version; zig version; } 2>&1 || true
          for report in benchmark-*.json benchmark-*.txt benchmark-*.md; do
            if test -f "$report"; then echo "===== $report ====="; cat "$report"; fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-release
          path: |
            ci-artifacts/linux/**
            Core-Go/shadow6-go*
            Core-Rust/shadow6-rust*
            Core-Gleam/shadow6-gleam*
            Core-Cpp/shadow6-cpp
            Core-Zig/shadow6-zig
            Core-Zig/zig-out/bin/shadow6-zig
            Core-Ada/shadow6-ada*
            Core-D/shadow6-d*
            Core-Nim/shadow6-nim*
            Core-Pony/shadow6-pony*
            Core-Hare/shadow6-hare*
            Core-Carp/shadow6-carp*
            Gate/shadow6-gate
            Guard/shadow6-guard
            C11Relay/bridge_relay
            C11Relay/c11relay_test
          if-no-files-found: error
  linux-arm64:
    name: Linux ARM64 complete component matrix
    runs-on: ubuntu-24.04-arm
    needs: [idris, carp-generated]
    timeout-minutes: 120
    env:
      BUILD_HARE: '1'
      BUILD_CARP: '1'
      CARP_GENERATED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v6
        with: {go-version-file: Core-Go/go.mod}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: goto-bus-stop/setup-zig@v2
        with: {version: '0.16.0'}
      - uses: jiro4989/setup-nim-action@v2
        timeout-minutes: 15
        with: {nim-version: '2.2.10'}
      - name: Install Linux ARM64 native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libsodium-dev libunistring-dev \
            gnat gprbuild ldc musl-tools shellcheck unzip autoconf m4 \
            libncurses-dev zlib1g-dev cmake libgmp-dev
          bash Tools/bootstrap_chez_linux.sh
      - uses: actions/download-artifact@v7
        with:
          name: shadow6-carp-generated
          path: ${{ runner.temp }}/carp-generated
      - uses: actions/download-artifact@v7
        with:
          name: shadow6-idris-ubuntu-24.04-arm
          path: ${{ runner.temp }}/idris-arm64
      - name: Restore same-commit Carp sources and native Idris runtime
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/carp-generated/carp-generated.tar.gz"
          tar -xzf "$RUNNER_TEMP/idris-arm64/core-idris-runtime.tar.gz" -C Core-Idris
          chmod +x Core-Idris/shadow6-idris Core-Idris/shadow6-idris-crosed
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/Core-Idris:$GITHUB_WORKSPACE/Core-Idris/ffi" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/Core-Idris:$GITHUB_WORKSPACE/Core-Idris/ffi" Core-Idris/shadow6-idris --feature-report
      - name: Provision native ARM64 Hare
        run: |
          bash Tools/bootstrap_hare_linux.sh "$GITHUB_WORKSPACE/.tools/hare-ci"
          echo "$GITHUB_WORKSPACE/.tools/hare-ci/bin" >> "$GITHUB_PATH"
      - name: Build pinned ARM64 libdatachannel
        run: |
          set -euo pipefail
          git clone https://github.com/paullouisageneau/libdatachannel.git "$RUNNER_TEMP/shadow6-rtc-arm64"
          git -C "$RUNNER_TEMP/shadow6-rtc-arm64" checkout --detach 9e6a13abbb6846c003d817d0387b6706466e2b03
          git -C "$RUNNER_TEMP/shadow6-rtc-arm64" submodule update --init --recursive --depth 1
          cmake -S "$RUNNER_TEMP/shadow6-rtc-arm64" -B "$RUNNER_TEMP/shadow6-rtc-arm64-build" -DCMAKE_BUILD_TYPE=Release -DNO_TESTS=ON -DNO_EXAMPLES=ON -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/shadow6-rtc-arm64-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/shadow6-rtc-arm64-build"
          sudo ldconfig
          cp -L /usr/local/lib/libdatachannel.so.0.23 Core-Nim/libdatachannel.so.0.23
      - name: Provision the native ARM64 Gleam toolchain
        run: |
          bash Core-Gleam/tools/fetch_toolchain.sh
          bash Core-Gleam/tools/build_toolchain.sh
      - name: Provision the ARM64 Pony toolchain
        run: |
          set -euo pipefail
          mkdir -p .tools/ponyc-0.72.0
          curl --fail --location --retry 3 \
            --output /tmp/ponyc.tar.gz \
            https://github.com/ponylang/ponyc/releases/download/0.72.0/ponyc-arm64-unknown-linux-ubuntu24.04.tar.gz
          echo '7e18265d56281cce4c5e9c6d65fb48d65ecc8d93591c3ddd8111ef6e026ead64  /tmp/ponyc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ponyc.tar.gz --strip-components=1 -C .tools/ponyc-0.72.0
          test -x .tools/ponyc-0.72.0/bin/ponyc
      - name: Probe optional ARM64 toolchains and record explicit exclusions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadow6-arm64"
          {
            echo 'platform=linux-arm64'
            echo 'compiled=go,rust,cpp,zig,ada,d,nim,pony,hare,carp,gleam,idris,gate,guard,relay,offline-python'
            echo 'android=excluded: Android is covered by its dedicated APK job and receives no additional cores'
            echo 'detector-ml=excluded: pinned CPU PyTorch wheel is unavailable on Linux ARM64'
          } | tee "$RUNNER_TEMP/shadow6-arm64/support.txt"
      - name: Build Linux ARM64 cores and restore default policy
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          ./configure --enable-all
          make core-go core-rust core-cpp core-hare core-carp BUILD_HARE=1 BUILD_CARP=1 BUILD_ZIG=1 BUILD_ADA=1 BUILD_D=1 BUILD_PONY=1 BUILD_GLEAM=1
          test -f /usr/local/include/rtc/rtc.h
          make core-nim nim-crosed-variant
          make test-hare test-carp
          make pony-crosed-variant BUILD_PONY=1
          make crosed-variants BUILD_PONY=1 BUILD_GLEAM=1
          # Replace the repository's checked-in x86_64 Public6 products with
          # native ARM64 variants before the full test/audit stage.
          make public6-variants
          make ada-crosed-variant
          Core-Ada/test_cells
          .venv/bin/python Core-Ada/test_core.py
          make test-zig BUILD_ZIG=1
          if test -x Core-Nim/shadow6-nim; then make test-nim; fi
          make test-d
          make test-pony BUILD_PONY=1
          make test-gleam BUILD_GLEAM=1
          test -x Core-Go/shadow6-go
          test -x Core-Go/shadow6-go-crosed
          test -x Core-Rust/shadow6-rust
          test -x Core-Rust/shadow6-rust-crosed
          test -x Core-Cpp/shadow6-cpp
          test -x Core-Zig/shadow6-zig
          test -x Core-Ada/shadow6-ada
          test -x Core-Ada/shadow6-ada-crosed
          test -x Core-D/shadow6-d
          if test -e Core-Nim/shadow6-nim; then
            test -x Core-Nim/shadow6-nim
            test -x Core-Nim/shadow6-nim-crosed
          fi
          test -x Core-Pony/shadow6-pony
          test -x Core-Pony/shadow6-pony-crosed
          test -x Core-Gleam/shadow6-gleam
          test -x Core-Gleam/shadow6-gleam-crosed
      - name: Build Linux ARM64 non-Core components
        run: |
          set -euo pipefail
          make gate guard relay auto detector plugins package-manager easybuild crosed app-layer extension-system assistants slots control-center public6-contract
          test -x Gate/shadow6-gate
          test -x Guard/shadow6-guard
          test -x C11Relay/bridge_relay
          make test BUILD_DETECTOR=0
          make check
          make audit
      - name: Run ARM64 feature and loopback contracts
        run: |
          set -euo pipefail
          for binary in Core-Go/shadow6-go Core-Go/shadow6-go-crosed Core-Rust/shadow6-rust Core-Rust/shadow6-rust-crosed Core-Cpp/shadow6-cpp Core-Zig/shadow6-zig Core-Ada/shadow6-ada Core-D/shadow6-d Core-Pony/shadow6-pony Core-Gleam/shadow6-gleam; do
            test -x "$binary"
            "$binary" --feature-report >/dev/null
          done
          benchmark_cores=(go rust cpp zig ada d pony gleam hare carp idris)
          if test -x Core-Nim/shadow6-nim; then
            Core-Nim/shadow6-nim --feature-report >/dev/null
            benchmark_cores+=(nim)
          fi
          benchmark_args=()
          for core in "${benchmark_cores[@]}"; do benchmark_args+=(--core "$core"); done
          .venv/bin/python Benchmark/benchmark.py "${benchmark_args[@]}" --role network-chain --repeats 3 --require-network --output benchmark-linux-arm64
      - name: Upload Linux ARM64 network reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-arm64-network-benchmark
          path: benchmark-linux-arm64.*
          if-no-files-found: warn
      - name: Collect Linux ARM64 support manifest and artifacts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shadow6-linux-arm64"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/shadow6-arm64/support.txt" "$out/"
          cp benchmark-linux-arm64.* "$out/"
          for path in Core-Go/shadow6-go* Core-Rust/shadow6-rust* Core-Cpp/shadow6-cpp Core-Zig/shadow6-zig Core-Ada/shadow6-ada* Core-D/shadow6-d Core-Nim/shadow6-nim* Core-Pony/shadow6-pony* Core-Gleam/shadow6-gleam* Core-Hare/shadow6-hare Core-Carp/shadow6-carp Core-Idris/shadow6-idris* Core-Idris/libsodium_ffi.so Gate/shadow6-gate Guard/shadow6-guard C11Relay/bridge_relay; do
            test -e "$path" && cp -a "$path" "$out/"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-arm64-components
          path: ${{ runner.temp }}/shadow6-linux-arm64
          if-no-files-found: error
  linux-musl:
    name: Alpine musl ${{ matrix.arch }} component boundary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Build and test inside native Alpine musl
        run: |
          docker run --rm --interactive \
            --env SHADOW6_MUSL_ARCH='${{ matrix.arch }}' \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace alpine:3.23 /bin/sh <<'ALPINE'
          set -eu
          apk add --no-cache bash build-base ca-certificates cargo curl git go \
            libsodium-dev libunistring-dev make openssl-dev pkgconf python3 \
            py3-cryptography rust
          update-ca-certificates
          case "$(uname -m)" in
            x86_64) pony_arch=x86-64 ;;
            aarch64) pony_arch=arm64 ;;
            *) echo "unsupported Alpine architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          mkdir -p .tools/ponyc-0.72.0
          curl --fail --location --retry 3 \
            --output /tmp/ponyc.tar.gz \
            "https://github.com/ponylang/ponyc/releases/download/0.72.0/ponyc-${pony_arch}-unknown-linux-alpine3.23.tar.gz"
          case "$pony_arch" in
            x86-64) pony_sha256=cce111f19d5628d390a8590b4a748677def0566a960427d922546bfb204a1ec4 ;;
            arm64) pony_sha256=a039f74ea6f2770940814848e7bc63fe70f7b33ef9549abf9ea3c9fced353992 ;;
            *) echo "missing Pony checksum for $pony_arch" >&2; exit 2 ;;
          esac
          echo "$pony_sha256  /tmp/ponyc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ponyc.tar.gz --strip-components=1 -C .tools/ponyc-0.72.0
          test -x .tools/ponyc-0.72.0/bin/ponyc
          export PONYC=/workspace/.tools/ponyc-0.72.0/bin/ponyc
          export BUILD_GLEAM=0 BUILD_HARE=0 BUILD_CARP=0 BUILD_ADA=0 BUILD_D=0 BUILD_NIM=0
          ./configure --enable-all
          make core-go core-rust core-cpp BUILD_PONY=1
          make pony-crosed-variant BUILD_PONY=1
          make crosed-variants BUILD_PONY=1 BUILD_GLEAM=0
          (cd Core-Go && go test ./...)
          (cd Core-Rust && cargo test --all-targets -- --test-threads=1)
          (cd Core-Cpp && bash ./test.sh)
          python3 -m py_compile CLI/*.py Gate/*.py
          for binary in Core-Go/shadow6-go Core-Go/shadow6-go-crosed Core-Rust/shadow6-rust Core-Rust/shadow6-rust-crosed Core-Cpp/shadow6-cpp Core-Pony/shadow6-pony Core-Pony/shadow6-pony-crosed; do
            test -x "$binary"
            "$binary" --feature-report >/dev/null
          done
          make gate guard relay auto detector package-manager easybuild crosed app-layer extension-system assistants slots control-center public6-contract
          python3 -m py_compile Plugin-System/shadow6_plugins.py \
            Plugin-System/sign_plugin.py plugins/*/main.py
          cp -R plugins /tmp/shadow6-plugins
          cp Plugin-System/trusted_signers.json /tmp/shadow6-trusted-signers.json
          python3 Plugin-System/shadow6_plugins.py \
            --plugin-root /tmp/shadow6-plugins \
            --trust-store /tmp/shadow6-trusted-signers.json list
          {
            echo "platform=linux-musl-$SHADOW6_MUSL_ARCH"
            echo 'supported=go,rust,cpp,pony,gate,guard,relay,offline-python'
            echo 'gleam=excluded: no verified Alpine/musl Gleam/BEAM runtime in this workflow'
            echo 'excluded=ada,d,nim,hare,carp,idris,gleam: no verified Alpine/musl toolchain in this workflow'
            echo 'android=excluded: Android uses the dedicated Bionic APK job and no additional cores'
          } > support.txt
          test -x Gate/shadow6-gate
          test -x Guard/shadow6-guard
          test -x C11Relay/bridge_relay
          ALPINE
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-linux-musl-${{ matrix.arch }}-components
          path: |
            support.txt
            Core-Go/shadow6-go*
            Core-Rust/shadow6-rust*
            Core-Cpp/shadow6-cpp
            Core-Pony/shadow6-pony*
            Gate/shadow6-gate
            Guard/shadow6-guard
            C11Relay/bridge_relay
          if-no-files-found: error
  macos:
    name: macOS ${{ matrix.arch }} native components
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v6
        with: {go-version-file: Core-Go/go.mod}
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ matrix.arch }}-${{ hashFiles('**/go.sum', '**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS native core dependencies
        run: |
          brew install openssl@3 libsodium libunistring zig epoll-shim
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - run: |
          cd Core-Go && go test ./...
          cd ../Gate && go test ./... && go build -trimpath -o shadow6-gate .
          cd ../Guard && go test ./... && bash ./compile.sh
      - shell: bash
        run: |
          cd Core-Go
          bash ./compile.sh
          CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
          mv shadow6-go shadow6-go-crosed
          CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
          cd ../Gate && go build -trimpath -o shadow6-gate .
          cd ../Guard && bash ./compile.sh
          cd ../Core-Cpp
          brew_prefix="$(brew --prefix openssl@3)"
          CPPFLAGS="-I$brew_prefix/include" LDFLAGS="-L$brew_prefix/lib" bash ./compile.sh
          CPPFLAGS="-I$brew_prefix/include" LDFLAGS="-L$brew_prefix/lib" bash ./test.sh
          cd ../Core-Zig
          zig build -Doptimize=ReleaseSafe
          zig build test -Doptimize=ReleaseSafe
          test -x zig-out/bin/shadow6-zig
          # Core-Nim's checked-in native.c uses Linux-only accept4/st_mtim
          # interfaces. Keep the exclusion explicit and auditable rather than
          # treating an unrelated Darwin dependency as a successful build.
          echo 'Core-Nim: excluded on Darwin by its checked-in POSIX C boundary'
          cd ..
          # C11Relay is exercised with epoll-shim's kqueue implementation;
          # no source rewrite or preload interposition is allowed.
          relay_inc="$(brew --prefix epoll-shim)/include/libepoll-shim"
          relay_lib="$(brew --prefix epoll-shim)/lib"
          cc -std=c11 -O2 -fPIE -pie -D_GNU_SOURCE -I"$relay_inc" \
            C11Relay/c11relay.c -L"$relay_lib" -lepoll-shim \
            -o C11Relay/bridge_relay
          test -x C11Relay/bridge_relay
          cd Core-Rust
          bash ./compile.sh
          CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
          mv shadow6-rust shadow6-rust-crosed
          CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
          cd ..
          printf 'platform=macos-%s\ncompiled=go,rust,cpp,zig,gate,guard,relay\nexcluded=nim,ada,d,pony,hare,carp: checked-in Unix/Linux boundaries or toolchain scope\nandroid=excluded: dedicated Bionic APK job\n' '${{ matrix.arch }}' > support-macos-${{ matrix.arch }}.txt
      - name: Run final macOS benchmark after every build and test
        run: |
          benchmark_cores=(--core go --core rust --core cpp)
          if test '${{ matrix.arch }}' = arm64; then
            benchmark_cores+=(--core zig)
          else
            echo 'zig-network=excluded: x86 runner temporary-directory ownership fails the Zig secure-config contract' >> support-macos-${{ matrix.arch }}.txt
          fi
          .venv/bin/python Benchmark/benchmark.py "${benchmark_cores[@]}" \
            --role network-chain --repeats 3 --output benchmark-macos-${{ matrix.arch }}
      - name: Upload macOS network reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shadow6-macos-network-benchmark-${{ matrix.arch }}
          path: |
            benchmark-macos-${{ matrix.arch }}.json
            benchmark-macos-${{ matrix.arch }}.txt
            benchmark-macos-${{ matrix.arch }}.md
            support-macos-${{ matrix.arch }}.txt
          if-no-files-found: warn
      - name: Dump macOS environment and benchmark diagnostics
        if: always()
        run: |
          { uname -a; python3 --version; go version; rustc --version; zig version; } 2>&1 || true
          for report in benchmark-*.json benchmark-*.txt benchmark-*.md; do test -f "$report" && { echo "===== $report ====="; cat "$report"; }; done
          true
      - uses: actions/upload-artifact@v6
        with:
          name: shadow6-macos-${{ matrix.arch }}-components
          path: |
            Core-Go/shadow6-go
            Core-Go/shadow6-go-crosed
            Core-Rust/shadow6-rust
            Core-Rust/shadow6-rust-crosed
            Core-Cpp/shadow6-cpp
            Core-Zig/zig-out/bin/shadow6-zig
            C11Relay/bridge_relay
            Gate/shadow6-gate
            Guard/shadow6-guard
            benchmark-macos-${{ matrix.arch }}.json
            benchmark-macos-${{ matrix.arch }}.txt
            benchmark-macos-${{ matrix.arch }}.md
          if-no-files-found: error
  windows:
    name: Windows ${{ matrix.arch }} Go-family components
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
