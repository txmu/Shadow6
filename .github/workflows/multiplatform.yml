name: multiplatform
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: Core-Go/go.mod}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/Cargo.lock') }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.txt -r requirements-ml.txt
      - run: make build
      - run: make crosed-variants
      - run: make test
      - run: make check
      - run: make audit
      - run: .venv/bin/python Security-Assistants/shadow6_security.py doctor
      - run: .venv/bin/python Security-Assistants/shadow6_security.py sbom --output /tmp/shadow6-sbom.json
      - run: .venv/bin/python Infrastructure-Assistants/shadow6_infra.py observe --output /tmp/shadow6-observation.json
      - run: make package
      - run: |
          mkdir -p ci-artifacts/linux
          cp ../Shadow6.tar.gz ../Shadow6.zip ci-artifacts/linux/
          cp /tmp/shadow6-sbom.json /tmp/shadow6-observation.json ci-artifacts/linux/
          cp Core-Go/shadow6-go Core-Go/shadow6-go-crosed Core-Rust/shadow6-rust Core-Rust/shadow6-rust-crosed ci-artifacts/linux/
          tar -tzf ci-artifacts/linux/Shadow6.tar.gz >/dev/null
          unzip -tq ci-artifacts/linux/Shadow6.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-linux-release
          path: |
            ci-artifacts/linux/**
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: Core-Go/go.mod}
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ hashFiles('**/go.sum', '**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cd Core-Go && go test ./...
          cd ../Gate && go test ./...
          cd ../Guard && go test ./...
      - shell: bash
        run: |
          cd Core-Go
          bash ./compile.sh
          CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
          mv shadow6-go shadow6-go-crosed
          CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
          cd ../Core-Rust
          bash ./compile.sh
          CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
          mv shadow6-rust shadow6-rust-crosed
          CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-macos-core-go
          path: |
            Core-Go/shadow6-go
            Core-Go/shadow6-go-crosed
            Core-Rust/shadow6-rust
            Core-Rust/shadow6-rust-crosed
            Gate/shadow6-gate
            Guard/shadow6-guard
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: Core-Go/go.mod}
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: windows-${{ hashFiles('**/go.sum') }}
      - shell: bash
        run: |
          cd Core-Go && go test ./...
          cd ../Gate && go test ./...
          cd ../Guard && go test ./...
      - shell: bash
        run: |
          cd Core-Go
          bash ./compile.sh
          CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
          mv shadow6-go shadow6-go-crosed
          CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-windows-core-go
          path: |
            Core-Go/shadow6-go
            Core-Go/shadow6-go-crosed
            Gate/shadow6-gate
            Guard/shadow6-guard
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD native tests
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: freebsd
          version: '14.2'
          shell: bash
          run: |
            command -v go || (sudo pkg update -f || true; sudo pkg install -y go123 || sudo pkg install -y go)
            sudo pkg install -y rust cargo || true
            cd Core-Go
            go test ./...
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-go shadow6-go-crosed
            cd ../Core-Rust
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-rust shadow6-rust-crosed
            cd ../Guard
            go test ./...
            bash ./compile.sh
            cd ../Gate
            go test ./...
            go build -trimpath -o shadow6-gate .
            cd ../C11Relay
            bash ./compile.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-freebsd-release
          path: |
            Core-Go/shadow6-go*
            Core-Rust/shadow6-rust*
            Guard/shadow6-guard*
            Gate/shadow6-gate
            C11Relay/bridge_relay
          if-no-files-found: error
  openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD native tests
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: openbsd
          version: '7.6'
          shell: bash
          run: |
            command -v go || sudo pkg_add go
            cd Core-Go
            go test ./...
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-go shadow6-go-crosed
            cd ../Guard
            go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-openbsd-release
          path: Core-Go/shadow6-go*
          if-no-files-found: error
  netbsd:
    runs-on: ubuntu-latest
    name: NetBSD native tests
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: netbsd
          version: '10.1'
          shell: bash
          run: |
            if ! command -v go >/dev/null 2>&1; then
              mkdir -p "$HOME/.local"
              ftp -o /tmp/go.tar.gz https://go.dev/dl/go1.23.5.netbsd-amd64.tar.gz
              tar -xzf /tmp/go.tar.gz -C "$HOME/.local"
              export PATH="$HOME/.local/go/bin:$PATH"
            fi
            go version
            cd Core-Go
            go test ./...
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-go shadow6-go-crosed
            cd ../Guard
            go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-netbsd-release
          path: Core-Go/shadow6-go*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    name: Android APK release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with: {go-version-file: Core-Go/go.mod}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.40.0
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build native cores
        env:
          SHADOW6_ANDROID_BUILD_JOBS: '16'
        run: |
          ndk_dir="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358"
          test -d "$ndk_dir"
          python3 Android/build_android_cores.py --ndk "$ndk_dir"
          for abi in arm64-v8a x86_64; do
            for core in go rust d nim gate; do
              test -s "Android/app/src/main/jniLibs/$abi/libshadow6_${core}.so"
            done
          done
      - name: Build debug APK
        run: gradle --no-daemon --no-configuration-cache --max-workers=16 --console=plain -Dorg.gradle.jvmargs='-Xms256m -Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=8' -p Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
