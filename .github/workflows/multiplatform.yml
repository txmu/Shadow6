            ~/AppData/Local/go-build
          key: windows-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}
      - shell: bash
        run: |
          echo 'Windows native matrix: Go, Gate and Guard. Rust/C++/Zig/Nim/D/Ada remain excluded by checked-in POSIX source boundaries.'
          cd Core-Go
          go test ./...
          bash ./compile.sh
          CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
          mv shadow6-go shadow6-go-crosed
          CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
          cd ../Gate && go test ./... && go build -trimpath -o shadow6-gate .
          cd ../Guard && go test ./... && bash ./compile.sh
          cd ..
          printf 'platform=windows-%s\ncompiled=go,gate,guard\nexcluded=rust,cpp,zig,nim,ada,d,pony,hare,carp,gleam,idris: checked-in POSIX boundaries or native toolchain scope\nandroid=separate APK job\n' '${{ matrix.arch }}' > support-windows-${{ matrix.arch }}.txt
      - name: Measure native Windows Go network chain
        if: matrix.arch == 'amd64'
        shell: bash
        run: python Benchmark/benchmark.py --core go --role network-chain --repeats 3 --require-network --output benchmark-windows-${{ matrix.arch }}
      - name: Upload Windows network reports
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: shadow6-windows-network-benchmark-${{ matrix.arch }}
          path: |
            benchmark-windows-${{ matrix.arch }}.json
            benchmark-windows-${{ matrix.arch }}.txt
            benchmark-windows-${{ matrix.arch }}.md
          if-no-files-found: error
      - name: Dump Windows environment and benchmark diagnostics
        if: always()
        shell: bash
        run: |
          { uname -a; python --version; go version; } 2>&1 || true
          for report in benchmark-*.json benchmark-*.txt benchmark-*.md; do test -f "$report" && { echo "===== $report ====="; cat "$report"; }; done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-windows-${{ matrix.arch }}-components
          path: |
            Core-Go/shadow6-go*
            Gate/shadow6-gate*
            Guard/shadow6-guard*
            support-windows-${{ matrix.arch }}.txt
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD ${{ matrix.arch }} native tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: '14.4'
          architecture: ${{ matrix.arch }}
      - name: Test FreeBSD components
        shell: cpa.sh {0}
        run: |
            sudo pkg update -f
            # rust includes Cargo; the base system supplies Clang.
            sudo pkg install -y go rust python3 openssl libsodium libunistring libepoll-shim
            export PYTHON="$(command -v python3 || command -v python3.12)"
            for tool in go cargo c++ "$PYTHON"; do command -v "$tool" || exit 1; done
            cd Core-Go
            go test ./...
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-go shadow6-go-crosed
            CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
            cd ../Core-Rust
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-rust shadow6-rust-crosed
            CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
            cd ../Guard
            go test ./...
            bash ./compile.sh
            cd ../Gate
            go test ./...
            go build -trimpath -o shadow6-gate .
            # C11Relay is built through epoll-shim's kqueue implementation;
            # the checked-in source remains unchanged.
            cd ..
            relay_inc=/usr/local/include/libepoll-shim
            relay_lib=/usr/local/lib
            cc -std=c11 -O2 -fPIE -pie -D_GNU_SOURCE \
              -include netinet/in.h -I"$relay_inc" \
              C11Relay/c11relay.c -L"$relay_lib" -lepoll-shim \
              -o C11Relay/bridge_relay
            test -x C11Relay/bridge_relay
            cd Core-Cpp
            bash ./compile.sh
            bash ./test.sh
            echo 'Core-Zig: excluded on FreeBSD until the pinned translate-c/system-header combination passes'
            echo 'Core-Nim: excluded on FreeBSD because its checked-in native.c uses Linux-oriented interfaces'
            cd ..
            sudo pkg install -y py312-cryptography 2>/dev/null || true
            python3 -m venv --system-site-packages .venv
            .venv/bin/python -c 'import cryptography' 2>/dev/null || \
              .venv/bin/pip install --no-cache-dir --only-binary=:all: 'cryptography>=43,<47'
            .venv/bin/pip install --no-deps asyncssh || .venv/bin/pip install asyncssh
            printf 'platform=freebsd-%s\ncompiled=go,rust,cpp,gate,guard,relay\nexcluded=zig,nim,ada,d,pony,hare,carp,gleam,idris: explicit toolchain/source boundaries\nandroid=separate APK job\n' '${{ matrix.arch }}' > support-freebsd-${{ matrix.arch }}.txt
      - name: Measure FreeBSD native network chains
        shell: cpa.sh {0}
        run: .venv/bin/python Benchmark/benchmark.py --core go --core rust --role network-chain --repeats 3 --require-network --output benchmark-freebsd-${{ matrix.arch }}
      - name: Upload FreeBSD network reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow6-freebsd-network-benchmark-${{ matrix.arch }}
          path: |
            benchmark-freebsd-${{ matrix.arch }}.json
            benchmark-freebsd-${{ matrix.arch }}.txt
            benchmark-freebsd-${{ matrix.arch }}.md
            support-freebsd-${{ matrix.arch }}.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-freebsd-${{ matrix.arch }}-release
          path: |
            Core-Go/shadow6-go*
            Core-Rust/shadow6-rust*
            Guard/shadow6-guard*
            Gate/shadow6-gate
            C11Relay/bridge_relay
            Core-Cpp/shadow6-cpp
            benchmark-freebsd-${{ matrix.arch }}.json
            benchmark-freebsd-${{ matrix.arch }}.txt
            benchmark-freebsd-${{ matrix.arch }}.md
          if-no-files-found: error
  openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD ${{ matrix.arch }} native tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: openbsd
          version: '7.9'
          architecture: ${{ matrix.arch }}
          cpu_count: 2
          memory: 6G
      - name: Test OpenBSD components
        shell: cpa.sh {0}
        run: |
            sudo pkg_add go rust python-3.13.13 libsodium epoll-shim openssl-3.5.6v0
            export PYTHON="$(command -v python3.13 || command -v python3)"
            for tool in go cargo c++ "$PYTHON"; do command -v "$tool" || exit 1; done
            export CPPFLAGS='-I/usr/local/include/eopenssl35'
            export LDFLAGS='-L/usr/local/lib/eopenssl35 -Wl,-rpath,/usr/local/lib/eopenssl35'
            test -f /usr/local/include/eopenssl35/openssl/ssl.h
            # The Go network benchmark generates configs through the Python
            # orchestrator, which imports the pinned application dependencies.
            "$PYTHON" -m venv .venv
            export PYTHON="$PWD/.venv/bin/python"
            OPENSSL_INCLUDE_DIR=/usr/local/include/eopenssl35 OPENSSL_LIB_DIR=/usr/local/lib/eopenssl35 "$PYTHON" -m pip install -r requirements.txt
            cd Core-Go
            go test ./...
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-go shadow6-go-crosed
            CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
            cd ../Core-Rust
            bash ./compile.sh
            CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh
            mv shadow6-rust shadow6-rust-crosed
            CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh
            cd ../Guard
            go test ./...
            bash ./compile.sh
            cd ../Gate
            go test ./...
            go build -trimpath -o shadow6-gate .
            cd ..
            cc -std=c11 -O2 -fPIE -pie -D_GNU_SOURCE -I/usr/local/include/libepoll-shim \
              C11Relay/c11relay.c -L/usr/local/lib -lepoll-shim \
              -o C11Relay/bridge_relay
            test -x C11Relay/bridge_relay
            cd Core-Cpp
            bash ./compile.sh
            bash ./test.sh
            echo 'Core-Nim: excluded on OpenBSD because its checked-in native.c uses Linux-oriented interfaces'
            cd ..
            printf 'platform=openbsd-%s\ncompiled=go,rust,cpp,gate,guard,relay\nexcluded=zig,nim,ada,d,pony,hare,carp,gleam,idris: explicit toolchain/source boundaries\nandroid=separate APK job\n' '${{ matrix.arch }}' > support-openbsd-${{ matrix.arch }}.txt
      - name: Measure OpenBSD native network chains
        shell: cpa.sh {0}
        run: .venv/bin/python Benchmark/benchmark.py --core go --core rust --core cpp --role network-chain --repeats 3 --output benchmark-openbsd-${{ matrix.arch }}
      - name: Upload OpenBSD network reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow6-openbsd-network-benchmark-${{ matrix.arch }}
          path: |
            benchmark-openbsd-${{ matrix.arch }}.json
            benchmark-openbsd-${{ matrix.arch }}.txt
            benchmark-openbsd-${{ matrix.arch }}.md
            support-openbsd-${{ matrix.arch }}.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-openbsd-${{ matrix.arch }}-release
          path: |
            Core-Go/shadow6-go*
            Core-Rust/shadow6-rust*
            Guard/shadow6-guard
            Gate/shadow6-gate
            C11Relay/bridge_relay
            Core-Cpp/shadow6-cpp
            benchmark-openbsd-${{ matrix.arch }}.json
            benchmark-openbsd-${{ matrix.arch }}.txt
            benchmark-openbsd-${{ matrix.arch }}.md
          if-no-files-found: error
  netbsd:
    runs-on: ubuntu-latest
    name: NetBSD ${{ matrix.arch }} native tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: Core-Go/go.mod
          check-latest: true
          cache: false
      - name: Prepare verified NetBSD Go toolchain
        if: matrix.arch == 'x86-64'
        timeout-minutes: 5
        run: python3 Tools/prepare_netbsd_go.py "$(go env GOVERSION)" .tmp/netbsd-go
      # v1.6.0 supports the x86-64 and ARM64 guests and fixes VM startup
      # error handling.
      # https://github.com/cross-platform-actions/action/issues/158
      - name: Boot and test NetBSD
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        timeout-minutes: 20
        with:
          operating_system: netbsd
          version: '10.1'
          architecture: ${{ matrix.arch }}
          cpu_count: 2
          memory: 4G
      - name: Test NetBSD components
        shell: cpa.sh {0}
        run: |
          sudo pkgin -y install go python311
          export PYTHON=/usr/pkg/bin/python3.11
          export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
          go_pkg=$(/usr/pkg/sbin/pkg_info -a | awk '/^go[0-9]+-[0-9]/ {sub(/-[0-9].*/, ""); print; exit}')
          test -n "$go_pkg"
          go_bin=$(/usr/pkg/sbin/pkg_info -L "$go_pkg" | awk '/\/bin\/go$/ {print; exit}')
          test -x "$go_bin"
          export PATH="$(dirname "$go_bin"):$PATH"
          if test '${{ matrix.arch }}' = x86-64; then
            bash Tools/test_netbsd.sh
          else
            # NetBSD's verified host archive is amd64-only. On ARM64 use the
            # native pkgsrc Go toolchain and keep the same variant contract.
            for component in Core-Go Guard Gate; do
              (cd "$component" && go test -buildvcs=false -count=1 -timeout=5m ./...)
            done
            (cd Core-Go && bash ./compile.sh && \
              CROSED_LEVEL=5 APP_TRANSPORT=1 QUBES_ISOLATION=1 bash ./compile.sh && \
              mv shadow6-go shadow6-go-crosed && \
              CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0 bash ./compile.sh)
          fi
          # Tools/test_netbsd.sh deliberately tests Gate/Guard but does not
          # publish their binaries; build them for both architectures here.
          (cd Guard && bash ./compile.sh)
          (cd Gate && go build -trimpath -o shadow6-gate .)
          printf 'platform=netbsd-%s\ncompiled=go,gate,guard\nexcluded=rust,cpp,zig,nim,ada,d,pony,hare,carp,gleam,idris: explicit guest/toolchain boundaries\nandroid=separate APK job\n' '${{ matrix.arch }}' > support-netbsd-${{ matrix.arch }}.txt
          test -x Core-Go/shadow6-go
          test -x Core-Go/shadow6-go-crosed
      - name: Measure NetBSD native Go network chain
        shell: cpa.sh {0}
        run: |
          # NetBSD's Python 3.11 has no compatible cryptography wheel and
          # building it would require Rust unavailable in the guest. Use the
          # native pkgsrc build for cryptography, then install the pure/Python
          # dependencies without invoking pip's Rust build isolation.
          sudo pkgin -y install py311-cryptography
          /usr/pkg/bin/python3.11 -m venv --system-site-packages .venv
          # stack_test imports only cryptography; aiohttp and the UI packages
          # have no compatible NetBSD wheels and are not used by this check.
          .venv/bin/python Benchmark/benchmark.py --core go --role network-chain --repeats 3 --require-network --output benchmark-netbsd-${{ matrix.arch }}
      - name: Upload NetBSD network reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow6-netbsd-network-benchmark-${{ matrix.arch }}
          path: |
            benchmark-netbsd-${{ matrix.arch }}.json
            benchmark-netbsd-${{ matrix.arch }}.txt
            benchmark-netbsd-${{ matrix.arch }}.md
            support-netbsd-${{ matrix.arch }}.txt
          if-no-files-found: warn
      - name: NetBSD boot diagnostics
        if: failure()
        run: |
          lscpu
          if test -f /tmp/cross-platform-actions.log; then
            sudo tail -n 200 /tmp/cross-platform-actions.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-netbsd-${{ matrix.arch }}-release
          path: |
            Core-Go/shadow6-go
            Core-Go/shadow6-go-crosed
            Gate/shadow6-gate
            Guard/shadow6-guard
            benchmark-netbsd-${{ matrix.arch }}.json
            benchmark-netbsd-${{ matrix.arch }}.txt
            benchmark-netbsd-${{ matrix.arch }}.md
          if-no-files-found: error
  unix-extra:
    name: ${{ matrix.os }} ${{ matrix.arch }} portable component boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: dragonflybsd
            version: '6.4.2'
            arch: x86-64
          - os: omnios
            version: 'r151058'
            arch: x86-64
    steps:
      - uses: actions/checkout@v4
      - name: Boot ${{ matrix.os }} VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
          cpu_count: 2
          memory: 6G
      - name: Build portable Unix components
        shell: cpa.sh {0}
        run: |
          set -euo pipefail
          work_dir="$GITHUB_WORKSPACE/.tmp/shadow6-${{ matrix.os }}"
          mkdir -p "$work_dir"
          if test '${{ matrix.os }}' = dragonflybsd; then
            sudo pkg update -f
            # Preserve the VM bootstrap rsync before the package transaction,
            # which removes its auto-installed rsync and sudo packages.
            sudo sh -c 'cp /usr/local/bin/rsync /usr/bin/rsync && \
              pkg install -y go python3 openssl libsodium gcc'
          else
            # OmniOS is a SysV/illumos environment. Use only its native
            # package repositories and the official illumos Go tarball; never
            # claim Linux binaries are native OmniOS artifacts.
            sudo pkg refresh --full
            sudo pkg install --accept -v archiver/gnu-tar developer/gcc14 \
              developer/build/make developer/versioning/git curl
            go_version=1.25.0
            curl --fail --location --retry 3 \
              "https://go.dev/dl/go${go_version}.illumos-amd64.tar.gz" \
              -o "$work_dir/go-illumos.tar.gz"
            sudo rm -rf /usr/local/go
            sudo mkdir -p /usr/local
            sudo /usr/bin/gtar -xzf "$work_dir/go-illumos.tar.gz" -C /usr/local
            export PATH=/usr/local/go/bin:$PATH
          fi
          command -v go
          go version
          if test '${{ matrix.os }}' = dragonflybsd; then
            for component in Core-Go Gate Guard; do
              (cd "$component" && go test -buildvcs=false -count=1 -timeout=5m ./...)
            done
            go_verification=compiled-and-tested
          else
            # The checked-in Unix test uses syscall.Mkfifo, which Go does not
            # expose on illumos. Verify every Go package builds without
            # weakening or rewriting that platform-specific source test.
            for component in Core-Go Gate Guard; do
              (cd "$component" && go build -buildvcs=false ./...)
            done
            go_verification='compiled; tests excluded: syscall.Mkfifo is unavailable on illumos'
          fi
          # DragonFly's Go port does not support -buildmode=pie. These are
          # pure-Go binaries, so build them directly without changing source.
          (cd Core-Go && \
            CGO_ENABLED=0 go build -buildvcs=false -trimpath \
              -ldflags='-s -w -buildid=' -o shadow6-go . && \
            CGO_ENABLED=0 go build -buildvcs=false -trimpath \
              -ldflags='-s -w -buildid=' \
              -tags 'crosed,crosed_l5,app_transport,qubes_isolation' \
              -o shadow6-go-crosed .)
          (cd Gate && go build -trimpath -o shadow6-gate .)
          (cd Guard && CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags='-s -w -buildid=' -o shadow6-guard .)
          if command -v c++ >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1 && command -v pkg-config >/dev/null 2>&1 && pkg-config --exists openssl; then
            cxxflags="$(pkg-config --cflags openssl)"
            ldflags="$(pkg-config --libs openssl)"
            (cd Core-Cpp && c++ -std=c++20 -O2 -fPIE -pie -fno-exceptions -fno-rtti -pthread $cxxflags src/main.cpp $ldflags -o shadow6-cpp && \
              c++ -std=c++20 -O1 -fno-exceptions -fno-rtti -pthread $cxxflags tests.cpp $ldflags -o "$work_dir/cpp-probe" && \
              "$work_dir/cpp-probe" && SHADOW6_CPP_PROBE="$work_dir/cpp-probe" python3 test_core.py)
          else
            echo 'cpp=excluded: native C++/OpenSSL development files unavailable'
          fi
          if command -v cargo >/dev/null 2>&1; then
            (cd Core-Rust && bash ./compile.sh)
          else
            echo 'rust=excluded: native Cargo toolchain unavailable'
          fi
          mkdir -p "$work_dir/artifact"
          cp Core-Go/shadow6-go* Gate/shadow6-gate Guard/shadow6-guard \
            "$work_dir/artifact/"
          for optional in Core-Rust/shadow6-rust* Core-Cpp/shadow6-cpp C11Relay/bridge_relay; do
            test -e "$optional" && cp -a "$optional" "$work_dir/artifact/"
          done
          test -x "$work_dir/artifact/shadow6-go"
          {
            echo "platform=${{ matrix.os }}-${{ matrix.arch }}"
            echo "go,gate,guard=$go_verification"
            echo 'rust,cpp,relay,gleam,ada,d,nim,pony,hare,carp,idris=individual-toolchain-boundary'
            echo 'android=excluded: Android receives no additional Core binaries'
          } > "$work_dir/artifact/support.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-${{ matrix.os }}-${{ matrix.arch }}-components
          path: .tmp/shadow6-${{ matrix.os }}/artifact
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    name: Android APK release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with: {go-version-file: Core-Go/go.mod}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache Android Nim toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.choosenim
            ~/.nimble
            ~/.cache/nim
          key: nim-android-2.2.10
      - uses: jiro4989/setup-nim-action@v2
        timeout-minutes: 5
        with:
          nim-version: '2.2.10'
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.40.0
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build Android OpenSSL and libsodium
        # Crypto sources are pinned and fetched only in the explicit CI setup.
        # Local verification uses already-provisioned sources without downloads.
        env:
          SHADOW6_ANDROID_BUILD_JOBS: '16'
        run: |
          git clone https://github.com/openssl/openssl.git "$RUNNER_TEMP/shadow6-openssl"
          git -C "$RUNNER_TEMP/shadow6-openssl" checkout --detach f4dc4d58b48d346a8270183f89acf826d459b0ca
          git clone https://github.com/jedisct1/libsodium.git "$RUNNER_TEMP/shadow6-sodium"
          git -C "$RUNNER_TEMP/shadow6-sodium" checkout --detach 9511c982fb1d046470a8b42aa36556cdb7da15de
          (cd "$RUNNER_TEMP/shadow6-sodium" && autoreconf -fi)
          python3 Android/build_android_crypto.py \
            --ndk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358" \
            --openssl-source "$RUNNER_TEMP/shadow6-openssl" \
            --sodium-source "$RUNNER_TEMP/shadow6-sodium" \
            --output "$GITHUB_WORKSPACE/.tmp/android-crypto"
      - name: Build Android libdatachannel
        env:
          SHADOW6_ANDROID_BUILD_JOBS: '16'
        run: |
          git clone https://github.com/paullouisageneau/libdatachannel.git "$RUNNER_TEMP/shadow6-rtc"
          git -C "$RUNNER_TEMP/shadow6-rtc" checkout --detach 9e6a13abbb6846c003d817d0387b6706466e2b03
          git -C "$RUNNER_TEMP/shadow6-rtc" submodule update --init --recursive --depth 1
          python3 Android/build_android_rtc.py \
            --ndk "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358" \
            --source "$RUNNER_TEMP/shadow6-rtc"
      - name: Build Android core executables
        env:
          SHADOW6_ANDROID_BUILD_JOBS: '16'
        run: |
          # Android intentionally keeps the existing App contract: Go, Rust,
          # D, Nim and Gate only. Other desktop cores may be evaluated on
          # Linux/Unix jobs but are not added to the APK or its selectors.
          ndk_dir="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/28.2.13676358"
          test -d "$ndk_dir"
          python3 Android/build_android_cores.py --ndk "$ndk_dir"
          for abi in arm64-v8a x86_64; do
            for core in go rust d nim gate; do
              test -s "Android/app/src/main/jniLibs/$abi/libshadow6_${core}.so"
            done
          done
      - name: Build debug APK
        run: gradle --no-daemon --no-configuration-cache --max-workers=16 --console=plain -Dorg.gradle.jvmargs='-Xms256m -Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=8' -p Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shadow6-android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  platform-summary:
    name: Cross-platform support summary
    if: always()
    needs:
      - pony-only
      - idris
      - linux-gleam
      - linux
      - linux-arm64
      - linux-musl
      - macos
      - windows
      - freebsd
      - openbsd
      - netbsd
      - unix-extra
      - android
    runs-on: ubuntu-latest
    steps:
      - name: Write platform result matrix
        env:
          PONY: ${{ needs['pony-only'].result }}
          IDRIS: ${{ needs.idris.result }}
          GLEAM: ${{ needs['linux-gleam'].result }}
          LINUX: ${{ needs.linux.result }}
          LINUX_ARM64: ${{ needs['linux-arm64'].result }}
          LINUX_MUSL: ${{ needs['linux-musl'].result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          FREEBSD: ${{ needs.freebsd.result }}
          OPENBSD: ${{ needs.openbsd.result }}
          NETBSD: ${{ needs.netbsd.result }}
          UNIX_EXTRA: ${{ needs['unix-extra'].result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          set -u
          mkdir -p support-summary
          {
            echo '{'
            printf '  "pony-only": "%s",\n' "$PONY"
            printf '  "idris": "%s",\n' "$IDRIS"
            printf '  "linux-gleam": "%s",\n' "$GLEAM"
            printf '  "linux": "%s",\n' "$LINUX"
            printf '  "linux-arm64": "%s",\n' "$LINUX_ARM64"
            printf '  "linux-musl": "%s",\n' "$LINUX_MUSL"
            printf '  "macos": "%s",\n' "$MACOS"
            printf '  "windows": "%s",\n' "$WINDOWS"
            printf '  "freebsd": "%s",\n' "$FREEBSD"
            printf '  "openbsd": "%s",\n' "$OPENBSD"
            printf '  "netbsd": "%s",\n' "$NETBSD"
            printf '  "unix-extra": "%s",\n' "$UNIX_EXTRA"
            printf '  "android": "%s"\n' "$ANDROID"
            echo '}'
          } > support-summary/platform-results.json
          cat support-summary/platform-results.json
          for status in "$PONY" "$IDRIS" "$GLEAM" "$LINUX" "$LINUX_ARM64" "$LINUX_MUSL" "$MACOS" "$WINDOWS" "$FREEBSD" "$OPENBSD" "$NETBSD" "$UNIX_EXTRA" "$ANDROID"; do
            case "$status" in
              failure|cancelled) exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow6-platform-results
          path: support-summary/platform-results.json
          if-no-files-found: error
