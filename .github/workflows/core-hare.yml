name: core-hare
on:
  push:
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect optional Hare toolchain
        run: |
          sudo apt-get update
          if apt-cache show hare >/dev/null 2>&1 && apt-cache show harec >/dev/null 2>&1 && apt-cache show qbe >/dev/null 2>&1; then
            sudo apt-get install -y hare harec qbe libsodium-dev
            echo "SHADOW6_HARE_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo 'Hare packages unavailable on this Ubuntu image; source contract only'
            echo "SHADOW6_HARE_AVAILABLE=0" >> "$GITHUB_ENV"
          fi
      - run: python3 Core-Hare/tests/test_contract.py
      - name: Build Hare implementation when available
        if: env.SHADOW6_HARE_AVAILABLE == '1'
        run: cd Core-Hare && hare build -l sodium -o shadow6-hare src/main.ha
      - name: Verify Hare feature contract when built
        if: env.SHADOW6_HARE_AVAILABLE == '1'
        run: Core-Hare/shadow6-hare --feature-report
