name: SCTP FastJob
on:
  push:
    branches-ignore: ['ci/wan-evidence']
    paths:
      - '.github/workflows/sctp-fastjob.yml'
      - 'Test-Lab/**'
      - 'Core-Cpp/**'
      - 'Core-Pony/**'
      - 'Control-Center/fd_gateway.py'
      - 'OCaml/privacy_envelope/**'
      - 'Deployment/**'
      - 'Crosed/**'
      - 'libshadow6/**'
      - 'integration/**'
      - 'Control-Center/privacy_envelope.py'
  pull_request:
    paths:
      - '.github/workflows/sctp-fastjob.yml'
      - 'Test-Lab/**'
      - 'Core-Cpp/**'
      - 'Core-Pony/**'
      - 'Control-Center/fd_gateway.py'
      - 'OCaml/privacy_envelope/**'
      - 'Deployment/**'
      - 'Crosed/**'
      - 'libshadow6/**'
      - 'integration/**'
      - 'Control-Center/privacy_envelope.py'
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
concurrency:
  group: sctp-fastjob-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fastjob:
    name: FastJob C++ / SCTP WAN EOF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install only the SCTP reproducer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ocaml opam libsodium-dev libssl-dev tcpdump iproute2
          python3 -m venv .tmp/sctp-fastjob-venv
          .tmp/sctp-fastjob-venv/bin/python -m pip install --disable-pip-version-check 'cryptography==50.0.1'
      - uses: actions/cache@v5
        with:
          path: ~/.opam
          key: sctp-fastjob-ubuntu24-ocaml-${{ hashFiles('OCaml/privacy_envelope/dune-project', 'OCaml/privacy_envelope/src/dune') }}
      - name: Build only the default C++ Core, SCTP envelope and application ABI
        run: |
          set -euo pipefail
          opam init --bare --no-setup -y
          if ! opam switch list --short | grep -Fxq sctp-fastjob; then
            opam switch create sctp-fastjob ocaml-system -y
          fi
          opam install --switch=sctp-fastjob dune digestif -y
          eval "$(opam env --switch=sctp-fastjob)"
          (cd Core-Cpp && CPPFLAGS='-DCROSED_LEVEL=0 -DAPP_TRANSPORT=0 -DQUBES_ISOLATION=0' bash ./compile.sh)
          dune build --root OCaml/privacy_envelope src/main.exe
          make -C libshadow6/native check PYTHON_CONFIG="$(command -v python3-config)"
          echo "SHADOW6_APPLICATION_LIBRARY=$PWD/libshadow6/native/libshadow6.so.1" >> "$GITHUB_ENV"
      - name: Verify both outgoing SCTP legs advertise only the routed source
        run: |
          set -euo pipefail
          S6EPE_BINARY="$PWD/OCaml/privacy_envelope/_build/default/src/main.exe" \
            PYTHONPATH=OCaml/privacy_envelope/test \
            .tmp/sctp-fastjob-venv/bin/python -m unittest -v \
              test_sctp_e2e.SCTPEnvelopeE2E.test_outgoing_associations_advertise_only_the_routed_source
      - name: Reproduce the real Native trio and SCTP carrier under directional WAN
        run: |
          set -euo pipefail
          # Only the compiled products cross into the root namespace driver.
          # Keep checkout ownership so workers still drop to the runner UID.
          sudo chown root:root -- Core-Cpp/shadow6-cpp \
            OCaml/privacy_envelope/_build/default/src/main.exe \
            libshadow6/native/libshadow6.so.1
          sudo --preserve-env=PATH,GITHUB_SHA,GITHUB_RUN_ID,SHADOW6_APPLICATION_LIBRARY \
            "$PWD/.tmp/sctp-fastjob-venv/bin/python" Test-Lab/sctp_fastjob.py \
              --repeats 2 --output-dir .tmp/sctp-fastjob-evidence
      - name: Publish the bounded reproduction summary
        if: always()
        run: |
          evidence_dir=.tmp/sctp-fastjob-evidence
          if test -d "$evidence_dir"; then
            sudo chown -R "$(id -u):$(id -g)" -- "$evidence_dir"
            if test -f "$evidence_dir/summary.md"; then
              cat "$evidence_dir/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shadow6-sctp-fastjob-evidence
          path: .tmp/sctp-fastjob-evidence/
          if-no-files-found: warn
          retention-days: 14
  pony-fd-fastjob:
    name: FastJob Pony application FD admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Prepare only the Pony and FD ABI dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsodium-dev libssl-dev tcpdump iproute2
          python3 -m venv .tmp/pony-fd-venv
          .tmp/pony-fd-venv/bin/python -m pip install --disable-pip-version-check 'cryptography==50.0.1'
          pony_dir=$(mktemp -d "$RUNNER_TEMP/shadow6-pony-compiler.XXXXXX")
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/ponylang/ponyc/releases/download/0.72.0/ponyc-x86-64-unknown-linux-ubuntu24.04.tar.gz \
            -o "$pony_dir/compiler.tar.gz"
          echo "a101427ff3daa510b821860b04a6bb786e42803fcfa8fa7723bb8183102b5a91  $pony_dir/compiler.tar.gz" | sha256sum -c -
          tar -xzf "$pony_dir/compiler.tar.gz" --strip-components=1 -C "$pony_dir"
          echo "PONYC=$pony_dir/bin/ponyc" >> "$GITHUB_ENV"
      - name: Build only the default Pony Core and application ABI
        run: |
          set -euo pipefail
          make core-pony BUILD_PONY=1 PONY_CROSED_LEVEL=0 CROSED_LEVEL=0 APP_TRANSPORT=0 QUBES_ISOLATION=0
          make -C libshadow6/native check PYTHON_CONFIG="$(command -v python3-config)"
          echo "SHADOW6_APPLICATION_LIBRARY=$PWD/libshadow6/native/libshadow6.so.1" >> "$GITHUB_ENV"
      - name: Exercise a real Pony FD attachment across owned namespaces
        run: |
          set -euo pipefail
          sudo chown root:root -- Core-Pony/shadow6-pony libshadow6/native/libshadow6.so.1
          sudo --preserve-env=PATH,SHADOW6_APPLICATION_LIBRARY \
            "$PWD/.tmp/pony-fd-venv/bin/python" - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'Test-Lab')
          from shadow6_test_lab import ROOT, _current_feature_report, _write_json
          from profile_registry import select_profile
          from native_pair import case
          profile = select_profile('pony', 'pony-udp')
          binary = ROOT / profile['artifact']
          admission = _current_feature_report(profile, binary)
          if admission['availability'] != 'AVAILABLE':
              raise SystemExit(admission.get('reason'))
          features = admission['featureReport']
          assert features['crosed_max_level'] == 0 and not features['app_transport'] and not features['qubes_isolation']
          output = Path('.tmp/pony-fd-evidence')
          row = case(profile, binary, 'clean', output, 'pony-fd-fastjob',
              capture_enabled=True, payload_bytes=4096, requests=2)
          _write_json(output / 'report.json', row)
          print('Pony FD:', row['status'], row.get('reason'))
          print(row.get('workerDiagnostics') or '')
          if row['status'] != 'PASS': raise SystemExit(1)
          PY
      - name: Hand back the owned diagnostics
        if: always()
        run: |
          if test -d .tmp/pony-fd-evidence; then
            sudo chown -R "$(id -u):$(id -g)" -- .tmp/pony-fd-evidence
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shadow6-pony-fd-fastjob-evidence
          path: .tmp/pony-fd-evidence/
          if-no-files-found: warn
          retention-days: 14
